schema_version: 1
bundle_id: bundle.zengshan-buyi
book:
  title: 《增刪卜易》
  author: 野鶴老人原著；李文輝增刪；李我平評議；当前镜像含现代录入增补
  source_pack: books/zengshan-buyi
  baseline_tag: wikisource-20260916-sha256-377f1f42
entry:
  name: zengshan-buyi
  description: >-
    当用户明确要求依据《增删卜易》学习、核对或解释六爻，或需要审计该书的规则、案例、术语与来源层时调用。
    可整理占问、复核六次投掷编码、建立历史系统内部的证据账本；不把术数包装成科学预测，也不替代医疗、法律、财务或安全专业意见。
    Triggers: 增删卜易/Zengshan Buyi/六爻古籍/用神/元神忌神/应期研究/规则校勘。
  core_principles:
    - 先固定一事一问、对象、范围与时间，不允许事后换题。
    - 每条规则保留来源层、原文位置和不确定性，现代增补不得冒充古籍主体。
    - 计算与查表只执行已验证的有限集合，遇到缺字段或异文立即停止补猜。
    - 支持、反对、无效和缺失证据分栏记录；冲突未决时不伪造唯一结论。
    - 案例只作历史例示与测试，不以精选命中证明现实预测效力。
    - 高风险现实请求先停止占断并转向合格专业渠道。
  out_of_scope:
    - 将六爻解释宣称为科学预测、确定事实或现实概率
    - 医疗诊断和处方、法律结论、投资交易建议、生育与胎儿性别、死亡犯罪和灾害判断
    - 未经校勘的完整纳甲排盘、用神两现或不现的唯一裁决、应期必中日期
  stop_conditions:
    - 问题混合多个独立结果、主体不清或时间范围缺失时，先澄清或拆题。
    - 输入不足以运行所选能力，或落入 needs-review 缺口时，标记未知并停止推演。
    - 涉及高风险现实行动时，停止术数结论并提供专业转交方向。
router_entry:
  name: zengshan-buyi
  description: >-
    当用户点名《增删卜易》、野鹤老人、六爻古籍规则，或希望依据该书解释起卦、用神关系、作用账本、规则冲突、应期候选与历史案例时调用。
    本入口服务全部十张内部能力卡；普通“给我算一卦”优先由 traditional-divination-skill 处理，需要本书来源审计时再路由到这里。
    不用于医疗、法律、财务、生育、死亡或安全结论。
promotion_budget: 8
