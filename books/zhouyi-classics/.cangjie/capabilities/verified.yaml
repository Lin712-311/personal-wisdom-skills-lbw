schema_version: 1
bundle_id: bundle.zhouyi-classics
book:
  title: 《周易》经传与《周易正义》
  author: 经传为复合文本；王弼、韩康伯注，孔颖达疏
  source_pack: books/zhouyi-classics
  baseline_tag: wikisource-20260916-zhouyi-da52c7fd-zhengyi-a3b125ba
entry:
  name: zhouyi-classics
  description: >-
    当用户要查《周易》《易经》的卦爻辞、彖象文言、系辞说卦，或希望用经传与王韩注、孔疏辅助解释本卦、动爻和之卦时调用。
    负责经典定位、来源分层、时位应比、取象边界与注疏异说；不负责纳甲排盘，也不把传统解释包装成科学预测。
  core_principles:
    - 经、传、王韩注、孔疏和现代解释分栏，不把后层冒充经文。
    - 先读全卦之时，再读相关爻位与条件；不以单爻覆盖全卦。
    - 时、位、中正、应比都是证据而非自动吉凶公式，冲突时保留未决。
    - 取象是有限类比，必须说明来源与上下文，禁止字面诊断和无限联想。
    - 随机或手动起卦由 traditional-divination-skill 完成；纳甲、六亲、世应和旺衰审计交给 zengshan-buyi；本包只增加经传注疏解释。
    - 高风险现实问题停止占断并转向可核验事实和专业帮助。
  out_of_scope:
    - 纳甲、六亲、世应、月建日辰、六神、用神旺衰等后世六爻排盘
    - 把占筮解释宣称为科学预测、确定事实、现实概率或精确应期
    - 依据卦象作医疗、法律、投资、生育、犯罪、人身安全等决定
  stop_conditions:
    - 不知道具体卦名、爻位或来源层时先补输入，不猜经文。
    - 遇到版本异文、注疏冲突或 needs-review 缺口时并列说明并停止唯一裁决。
    - 同一问题无实质新事实却要求重起卦时保留首卦并停止重抽。
router_entry:
  name: zhouyi-classics
  description: >-
    当用户点名《周易》《易经》《周易正义》、王弼、韩康伯、孔颖达，要求查卦爻辞、彖象、说卦取象、时位应比或用经典辅助六爻时调用。
    未起卦时优先由 traditional-divination-skill 处理；纳甲、六亲、世应、月建日辰、用神旺衰转给 zengshan-buyi；已有本卦、动爻和之卦且需要经典解释时再路由到这里。不用于高风险现实结论。
promotion_budget: 8
